[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
# Generated by pyside6-uic from .ui files — regenerated on every design change,
# never hand-edited, so lint findings here aren't actionable.
extend-exclude = ["src/todolist/ui_*.py"]

[tool.ruff.lint]
# Due dates are naive calendar dates by design (see SPEC.md) — DTZ flags
# date.today()/date.fromisoformat() as tz-unaware, which is intentional here.
ignore = ["DTZ"]
